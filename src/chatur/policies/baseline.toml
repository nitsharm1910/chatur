# Chatur baseline policy: loaded under EVERY profile; can't be weakened (ADR-0007, ADR-0014, ADR-0016).
# Verdicts: allow < log < warn < ask < deny. `unattended` = verdict when no human can answer.

schema = "chatur.policy/v1"
kind = "baseline"
description = "Non-weakenable guardrails: human-in-the-loop git, files, and execution."

[defaults]
unknown_tool = "ask"          # tools Chatur can't classify
unparseable_command = "ask"
adapter_error = "deny"        # fail closed on pre-tool events (ADR-0012)

# ---------------- git ----------------
[[rule]]
id = "git.no-commit-push"
adr = "ADR-0014"
baseline = true
critical = true
layers = ["hook", "git", "ci"]
applies_to = { tool_category = ["shell"] }
match.git_subcommands = ["commit", "push", "commit-tree", "update-ref", "merge", "cherry-pick", "revert", "am"]
verdict = "deny"
reason = "AI may not commit or push on any branch. A human must run this themselves."

[[rule]]
id = "git.no-history-rewrite"
adr = "ADR-0014"
baseline = true
critical = true
layers = ["hook", "ci"]
applies_to = { tool_category = ["shell"] }
match.git_subcommands = ["rebase", "filter-branch", "filter-repo", "tag", "clean", "restore", "reflog"]
match.git_patterns = [
  'reset\s+.*--hard', 'branch\s+.*-(d|D|m|M)\b', 'push\s+.*--force', 'stash\s+(drop|clear)',
  'checkout\s+.*--\s', 'gc\s+.*--prune',
]
verdict = "deny"
reason = "History/ref-rewriting git operations are reserved for humans."

[[rule]]
id = "git.remote-tools"
adr = "ADR-0014"
baseline = true
applies_to = { tool_category = ["mcp", "other"] }
match.tool_name_patterns = [
  '(?i)push_files', '(?i)create_or_update_file', '(?i)merge_pull_request',
  '(?i)create_branch', '(?i)delete_branch', '(?i)create_tag', '(?i)delete_file',
]
verdict = "deny"
reason = "Remote repository writes via tools are reserved for humans."

[[rule]]
id = "git.remote-cli"
adr = "ADR-0018"
baseline = true
layers = ["hook"]                  # git/CI can't see CLI calls; server-side branch protection backs this up
applies_to = { tool_category = ["shell"] }
# Matched against each real command as "<basename> <args>". (?:\s+-\S+(?:\s+[^-\s]\S*)?)* = optional flags.
match.argv_patterns = [
  '^gh(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+pr(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+(create|merge|close|reopen|edit|ready|review|comment|lock|unlock)\b',
  '^gh(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+issue(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+(create|close|reopen|edit|delete|comment|transfer|lock|unlock|pin|unpin|develop)\b',
  '^gh(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+release(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+(create|delete|edit|upload|delete-asset)\b',
  '^gh(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+repo(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+(create|delete|edit|rename|archive|unarchive|sync|fork|deploy-key\s+(add|delete))\b',
  '^gh(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+(secret|variable)(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+(set|delete|remove)\b',
  '^gh(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+workflow(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+(run|enable|disable)\b',
  '^gh(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+run(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+(cancel|rerun|delete)\b',
  '^gh(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+(label|gist)(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+(create|edit|delete|clone|rename)\b',
  '^gh(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+cache(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+delete\b',
  '^glab(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+mr(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+(create|merge|close|reopen|update|approve|note)\b',
  '^glab(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+issue(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+(create|close|reopen|update|delete|note)\b',
  '^glab(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+release(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+(create|delete|upload)\b',
  '^glab(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+repo(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+(create|delete|fork|archive)\b',
  '^glab(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+variable(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+(set|update|delete)\b',
  '^glab(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+ci(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+(run|retry|delete|cancel)\b',
  '^hub(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+(pull-request|merge|create|delete|fork)\b',
  '^hub(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+release(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+(create|edit|delete)\b',
  # write APIs: explicit write method, or body flags (which make the CLI default to POST)
  '^(gh|glab|hub)(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+api\b.*\s(-X\s*|--method[\s=]+|--request[\s=]+)(POST|PUT|PATCH|DELETE)\b',
  '^(gh|glab|hub)(?:\s+-\S+(?:\s+[^-\s]\S*)?)*\s+api\b.*\s(-f|--field|--raw-field|--input|--form)(\s|=|$)',
]
verdict = "deny"
reason = "Remote repository writes via gh/glab/hub are reserved for humans."

# ---------------- gate state & audit (ADR-0006, ADR-0008) ----------------
[[rule]]
id = "gate.state-protected"
adr = "ADR-0008"
baseline = true
critical = true
layers = ["hook", "git", "ci"]
applies_to = { tool_category = ["file_write", "shell"] }
match.path_globs = [".chatur/state.json", ".chatur/audit/**"]
verdict = "deny"
reason = "Gate state and the audit log are written only by the chatur CLI under human control."

# ---------------- files ----------------
[[rule]]
id = "fs.change-needs-approval"
adr = "ADR-0014"
baseline = true
layers = ["hook", "git"]
applies_to = { tool_category = ["file_write", "shell"] }
match.file_write = true            # any create/edit/rename/delete via file tools
match.shell_patterns = [
  '\b(rm|rmdir|del|erase|mv|move|ren|rename|tee|truncate)\b', '\bRemove-Item\b', '\bMove-Item\b',
  '\bRename-Item\b', '\bSet-Content\b', '\bAdd-Content\b', '\bOut-File\b', '\bNew-Item\b',
  '\bgit\s+(.*\s)?(rm|mv)\b', '\bsed\s+(.*\s)?-i', '>{1,2}',
]
verdict = "ask"
reason = "File change/delete requires human approval."

# ---------------- execution ----------------
[[rule]]
id = "exec.needs-approval"
adr = "ADR-0014"
baseline = true
applies_to = { tool_category = ["shell"] }
match.any = true                   # every shell command
verdict = "ask"
reason = "Running commands/executables requires human approval."

[[rule]]
id = "exec.no-new-executables"
adr = "ADR-0014"
baseline = true
layers = ["hook", "git"]
applies_to = { tool_category = ["file_write", "shell"] }
match.path_globs = ["**/*.sh", "**/*.ps1", "**/*.psm1", "**/*.bat", "**/*.cmd", "**/*.exe", "**/*.dll", "**/*.so", "**/*.dylib", ".git/hooks/**"]
match.shell_patterns = ['\bchmod\s+(.*\s)?\+?[0-7]*x', '\bicacls\b']
match.shebang = true
verdict = "ask"
reason = "Creating/modifying an executable requires human approval."

# Opt-in only by editing THIS file via a superseding ADR (ADR-0014, ADR-0016). Disabled by default.
[readonly_allowlist]
enabled = false
commands = ['^git\s+(status|log|diff|show)\b', '^(ls|dir|pwd|Get-ChildItem|Get-Location)\b']
