# Release pipeline (ADR-0031): tag vX.Y.Z -> build -> TestPyPI -> PyPI (approval) -> GitHub Release.
# Publishing uses PyPI trusted publishing (OIDC). No API tokens are stored anywhere.
# One-time setup: see docs/releases/checklist.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -m pip install --quiet .
          VERSION="$(chatur --version | awk '{print $2}')"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package version $VERSION"
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build
      - name: Verify the wheel ships policies, templates, and primitives
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for required in ("chatur/policies/baseline.toml", "chatur/templates/prd.md",
                           "chatur/_primitives/agents/chatur-architect.agent.md"):
              assert required in names, f"missing from wheel: {required}"
          print("wheel contents OK")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi # configure "Required reviewers" so a human approves the publish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release from docs/releases/<version>.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="docs/releases/${TAG#v}.md"
          if [ ! -f "$NOTES" ]; then echo "::error::missing $NOTES"; exit 1; fi
          gh release create "$TAG" dist/* --title "Chatur $TAG" --notes-file "$NOTES" --verify-tag
