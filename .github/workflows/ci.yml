# CI for Chatur itself (ADR-0012: 3.11 → latest stable + next pre-release; AGENTS.md rule 6: cross-platform).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        experimental: [false]
        include:
          # Next CPython pre-release: allowed to fail, catches breakage early.
          - { os: ubuntu-latest, python: "3.15", experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest

  # Dogfood the governance backstop through the repo's own composite action (ADR-0030).
  backstop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          before: ${{ github.event.before }}
